name: Python quality

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run pylint
        run: python -m pylint main.py checker tests

      - name: Run unit tests
        run: python -m unittest discover tests -v

      - name: Generate coverage report
        run: python -m coverage run --source=checker,main -m unittest discover tests

      - name: Show coverage
        run: python -m coverage report -m

      - name: Run CLI smoke test
        shell: bash
        run: |
          python main.py test_data/orig.txt test_data/orig_0.8_add.txt answer.txt
          test "$(cat answer.txt)" = "0.63"
          rm answer.txt
